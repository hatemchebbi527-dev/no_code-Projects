    <script>
      const b = PF.grid(CUES.grid);
      const $ = PF.$;
      const W = CUES.width, H = CUES.height;
      // Manuvo palette (manuvo/src/app/globals.css). Coral is the one highlight; red-900 for coral text on cream (contrast).
      // green-700 / green-50: the app's own "Verificato" chip (src/app/pubblica/LeadForm.tsx), used only for that state.
      const C = { cream: "#faf8f4", ink: "#1b1e24", coral: "#FF5758", coralText: "#C6383A", deep: "#6E1618", green: "#15803d", greenBg: "#f0fdf4", line: "#e5e5e5" };
      const at = (c) => b(c[0], c[1] || 1, c[2] || 0);
      const SC = CUES.scenes.map((s) => ({ name: s.name, from: at(s.from), to: at(s.to) }));
      // Avvita (enter) and click (success) from the Manuvo motion identity.
      const AVVITA = PF.ease("cubic-bezier(.16,1,.3,1)"), CLICK = PF.ease("cubic-bezier(.34,1.4,.64,1)");
      const BASTA = b(5, 3);
      const BENE2 = b(10, 1);
      let st, hud, S = {};

      /* ---------- helpers ---------- */
      function sceneAt(t) { let k = 0; SC.forEach((s, i) => { if (t >= s.from) k = i; }); return k; }
      // A slammed line: lands at `on`, leaves (quick blur) at `off`.
      function slam(id, t, on, off, from = 1.3) {
        const el = $(id);
        const live = t >= on && t < off + 0.12;
        PF.show(el, live);
        if (!live) return;
        const s = PF.slam(t, on, { from, length: 0.2, blur: 16 });
        const leave = PF.clamp01((t - off) / 0.12);
        PF.css(el, {
          transform: `scale(${(s.scale * (1 + leave * 0.08)).toFixed(4)})`,
          opacity: (s.opacity * (1 - leave)).toFixed(3),
          filter: s.blur + leave * 14 > 0.05 ? `blur(${(s.blur + leave * 14).toFixed(2)}px)` : "none",
        });
      }
      // Light glitch: a few frames of RGB split and jitter after each hit (hash of the frame, no randomness).
      const GLITCH = [[1, 2], [1, 4], [2, 4], [3, 1], [3, 4], [4, 3], [4, 4], [5, 1], [5, 3]].map(at);
      function glitch(t) {
        let a = 0;
        for (const g of GLITCH) { const d = t - g; if (d >= 0 && d < 0.13) a = Math.max(a, 1 - d / 0.13); }
        if (!a) return { a: 0, x: 0, sk: 0 };
        const f = Math.floor(t * 30), h = (n) => { const s = Math.sin(f * 12.9898 + n * 78.233) * 43758.5453; return s - Math.floor(s) - 0.5; };
        return { a, x: h(1) * 34 * a, sk: h(2) * 6 * a };
      }
      function scene(bg, far = 34) {
        const THREE = st.THREE, s = st.newScene();
        s.background = new THREE.Color(bg);
        s.fog = new THREE.Fog(bg, 9, far);
        s.environmentIntensity = 0.55;
        PF.three.lights(st, { scene: s, ground: bg, fill: 0.5, key: 1.6, keyPos: [-4, 8, 6] });
        return s;
      }
      function unlit(mesh) { mesh.material.toneMapped = false; return mesh; }
      // Shrink a line until it fits the safe width (measured after fonts load).
      function fit(el, max = 880) {
        PF.show(el, true);
        const r = document.createRange(); r.selectNodeContents(el);
        const w = r.getBoundingClientRect().width;
        if (w > max) el.style.fontSize = (parseFloat(el.style.fontSize) * max / w).toFixed(1) + "px";
        PF.show(el, false);
      }
      function contactTex(fake) {
        return PF.three.canvasTexture(st, 640, 240, (c, w, h) => {
          c.fillStyle = C.cream; c.beginPath(); c.roundRect(0, 0, w, h, 36); c.fill();
          c.fillStyle = "rgba(27,30,36,.12)"; c.beginPath(); c.arc(110, h / 2, 62, 0, Math.PI * 2); c.fill();
          c.fillStyle = C.ink; c.font = "800 70px Bricolage"; c.textAlign = "center"; c.fillText("?", 110, h / 2 + 25);
          c.textAlign = "left"; c.font = "700 46px Geist"; c.fillText(fake ? "+39 000 000 0000" : "+39 3•• ••• ••••", 200, 112);
          c.fillStyle = "rgba(27,30,36,.5)"; c.font = "500 32px Geist"; c.fillText(fake ? "numero falso" : "artigiano?", 200, 166);
          if (fake) { c.strokeStyle = C.coral; c.lineWidth = 10; c.beginPath(); c.moveTo(190, 98); c.lineTo(600, 98); c.stroke(); }
        });
      }

      /* ---------- setup ---------- */
      function setup() {
        document.querySelectorAll(".head").forEach((el) => fit(el));
        hud = PF.hud($("#hud-layer"), { size: 22, font: "'Geist Mono', monospace", top: CUES.safe.top - 60, bottom: CUES.safe.bottom - 60, color: "rgba(250,248,244,.72)" });
        st = PF.three.stage($("#three"), { width: W, height: H, fov: 50, env: true, bloom: { strength: 0.8, radius: 0.55, threshold: 1.0 }, exposure: 0.95 });
        const THREE = st.THREE, A = window.THREE_ADDONS;
        // The composer's OutputPass tone-maps the whole frame: no tone mapping keeps the brand swatches exact.
        st.renderer.toneMapping = THREE.NoToneMapping;

        /* 01 Hook: contact cards with no face drift in the fog below the words. */
        S.s1 = scene(C.ink, 26);
        const ct = contactTex(false);
        S.cards1 = [];
        for (let i = 0; i < 14; i++) {
          const r = PF.random(i * 19 + 7);
          const m = PF.three.card(st, ct, 2.2);
          m.userData = { x: (r() - 0.5) * 9, y: -2.3 - r() * 3.8, z: 1.5 - r() * 9, ry: (r() - 0.5) * 0.9, rz: (r() - 0.5) * 0.3, sp: 0.2 + r() * 0.35, ph: r() * 6 };
          S.s1.add(m); S.cards1.push(m);
        }
        S.dust1 = PF.three.particles(st, 420, {
          scene: S.s1, size: 0.05, color: (i) => (i % 5 ? C.cream : C.coral),
          pos: (i, t, o) => { const r = PF.random(i * 13 + 1); o.x = (r() - 0.5) * 16; o.y = (r() - 0.5) * 12 + t * 0.25; o.z = -r() * 12 + 2; },
        });
        unlit(S.dust1.points);

        /* The phone (shared by 02 Problema and 04 Soluzione; re-parented per scene). */
        S.phone = new THREE.Group();
        const body = new THREE.Mesh(new A.RoundedBoxGeometry(1.75, 3.5, 0.2, 6, 0.2), PF.three.mat("gloss", C.ink));
        S.phone.add(body);
        S.screenTex = PF.three.canvasTexture(st, 520, 1060, () => {});
        S.screenKey = "";
        const screen = PF.three.card(st, S.screenTex, 1.6);
        screen.material.fog = false; screen.position.z = 0.102; S.phone.add(screen);
        S.rings = [0, 1].map(() => { const m = new THREE.Mesh(new THREE.TorusGeometry(1, 0.05, 16, 96), new THREE.MeshBasicMaterial({ color: C.cream, transparent: true, toneMapped: false })); m.position.z = -0.05; S.phone.add(m); return m; });

        /* 02 Problema: coral, fake number chips flicker around the phone. */
        S.s2 = scene(C.coral);
        const fk = contactTex(true);
        S.chips = [];
        for (let i = 0; i < 9; i++) {
          const r = PF.random(i * 41 + 3);
          const m = PF.three.card(st, i % 2 ? fk : ct, 1.7);
          const side = i % 2 ? 1 : -1;
          m.userData = { x: side * (1.7 + r() * 1.6), y: -1.8 + r() * 3.6, z: -1 - r() * 4, ry: -side * (0.3 + r() * 0.4), rz: (r() - 0.5) * 0.4, ph: r() * 6, gone: b(3, 1) + (i + 1) * b.beat * 0.75 };
          S.s2.add(m); S.chips.push(m);
        }
        S.dust2 = PF.three.particles(st, 260, {
          scene: S.s2, size: 0.05, color: (i) => (i % 3 ? C.ink : C.cream),
          pos: (i, t, o) => { const r = PF.random(i * 7 + 3); o.x = (r() - 0.5) * 12; o.y = (r() - 0.5) * 10 + t * 0.2; o.z = -3 - r() * 8; },
        });
        unlit(S.dust2.points);

        /* 03 Basta: a coral cross slams toward the lens. */
        S.s3 = scene(C.ink, 40);
        S.cross = new THREE.Group();
        const bar = new A.RoundedBoxGeometry(3.4, 0.78, 0.78, 6, 0.3);
        const xm = PF.three.mat("gloss", C.coral, { emissive: C.coral, emissiveIntensity: 0.18 });

            S.burst.points.visible = t >= b(8, 2);
            if (S.burst.points.visible) { S.burst.update(t); S.burst.points.material.opacity = 1 - PF.clamp01((t - b(8, 3, 0.5)) / 0.5); }
            const shU = PF.progress(t, b(8, 1, 0.5), 0.25);
            S.shield.visible = t >= b(8, 1, 0.5);
            S.shield.material.opacity = Math.min(shU, 1 - PF.clamp01((t - b(8, 4)) / 0.3)) * 0.95;
            const turn = AVVITA(PF.progress(t, b(8, 2), 0.48)); // the signature: a sixth of a turn, stops dead
            S.shield.rotation.z = Math.PI / 6 + turn * (Math.PI / 3);
            const pulse = 1 + 0.08 * Math.exp(-Math.max(0, t - b(8, 2)) * 8) * (t >= b(8, 2) ? 1 : 0);
            S.shield.scale.set(pulse * PF.lerp(0.7, 1, AVVITA(shU)), pulse * PF.lerp(0.7, 1, AVVITA(shU)), 1);
            S.water.scale.setScalar(1 + (t - s0) * 0.02);
            S.dust4.update(t);
            PF.three.shots(st.camera, t, [
              { at: b(6, 1), azimuth: -14, elevation: 4, radius: 10, target: [0, 1.45, 0], drift: { azimuth: 6, radius: -0.4 } },
              { at: b(6, 3), azimuth: 10, elevation: 2, radius: 9.6, target: [0, 1.4, 0], drift: { azimuth: -5 } },
              { at: b(7, 1), azimuth: 0, elevation: 0, radius: 8.2, target: [0.1, 1.15, 0], drift: { radius: -0.5 } },
              { at: b(7, 3), azimuth: -10, elevation: 3, radius: 9.4, target: [0, 1.3, 0], drift: { azimuth: 5 } },
              { at: b(8, 1), azimuth: 12, elevation: 3, radius: 12, target: [0.4, 1.4, 0], drift: { azimuth: -4 } },
              { at: b(8, 3), azimuth: -6, elevation: 6, radius: 12.5, target: [0.3, 1.4, 0], drift: { radius: -0.6 } },
            ]);
          }
        } else if (k === 2) {
          st.use(S.s3);
          canvasOn = t < BASTA;
          const u = PF.step(t - SC[2].from + 0.05, { stiffness: 140, damping: 14 });
          S.cross.position.set(0, -0.6, PF.lerp(-26, 0, u));
          S.cross.rotation.set(0.25 * (1 - u), PF.lerp(-2.2, 0, u) + 0.06 * Math.sin(t * 7), PF.lerp(1.2, 0, u));
          S.dust3.update(t);
          const zoom = AVVITA(PF.progress(t, b(5, 2), 0.42));
          st.camera.position.set(0, -0.2, PF.lerp(12, 4.6, zoom));
          st.camera.lookAt(0, -0.45, 0);
        } else if (k === 4) {
          const two = t >= BENE2;
          st.use(two ? S.s5b : S.s5a);
          const p = two ? S.prismB : S.prismA;
          const s0 = two ? BENE2 : SC[4].from;
          // A sixth of a turn on beats 1 and 3 of the bar, stopping dead.
          const turns = [0, 2].reduce((a, bt) => a + AVVITA(PF.progress(t, s0 + bt * b.beat, 0.48)), 0);
          p.rotation.set(Math.PI / 2 - 0.35, turns * (Math.PI / 3) + 0.2, 0);
          p.position.set(0, -1.55, 0);
          const sIn = CLICK(PF.progress(t, s0, 0.3)); p.scale.setScalar(Math.max(0.001, PF.lerp(0.6, 1, sIn)));
          if (two) S.dust5.update(t);
          PF.three.shots(st.camera, t, [
            { at: s0, azimuth: -16, elevation: 8, radius: 11, target: [0, 0, 0], drift: { azimuth: 8 } },
            { at: s0 + 2 * b.beat, azimuth: 14, elevation: 2, radius: 10.5, target: [0, 0, 0], drift: { azimuth: -7, radius: -0.4 } },
          ]);
        } else {
          st.use(S.s6);
          const solid = PF.clamp01((t - b(11, 3)) / 0.18);
          S.swarm.update(t);
          S.swarm.points.material.opacity = 1 - solid;
          S.swarm.points.visible = solid < 1;
          S.logo.visible = solid > 0;
          S.logoFace.opacity = solid; S.logoSide.opacity = solid;
          const lu = PF.step(t - b(11, 3), { stiffness: 80, damping: 11 });
          S.logoGroup.rotation.set(0.12 * (1 - lu), -0.5 * (1 - lu) + 0.06 * Math.sin((t - b(11, 3)) * 1.1), 0);
          S.logoGroup.position.set(0, 1.3, 0);
          S.dust6.update(t);
          PF.three.shots(st.camera, t, [
            { at: b(11, 1), azimuth: 0, elevation: 0, radius: 10.5, target: [0, 0.05, 0], drift: { radius: -0.6, azimuth: 6 } },
            { at: b(11, 3), azimuth: 0, elevation: 0, radius: 9.6, target: [0, 0.05, 0], drift: { radius: -0.4 } },
            { at: b(12, 1), azimuth: 3, elevation: 1, radius: 9.6, target: [0, 0.05, 0], drift: { azimuth: -5, radius: -0.3 } },
          ]);
        }
        // Shake on the hits (camera wrapper, not the HUD).
        const sh = PF.shake(t, [b(3, 1), b(5, 1), b(5, 2), BASTA, b(8, 2), BENE2], { amp: 18, decay: 0.38 });
        const gl = glitch(t);
        PF.css($("#cam"), { transform: `translate(${(sh.x + gl.x).toFixed(2)}px, ${sh.y.toFixed(2)}px) rotate(${sh.r.toFixed(3)}deg) skewX(${gl.sk.toFixed(2)}deg)` });
        const onCoral = bg === C.coral;
        PF.css($("#words"), { textShadow: gl.a > 0 ? `${(9 * gl.a).toFixed(1)}px 0 ${onCoral ? "rgba(250,248,244,.85)" : "rgba(255,87,88,.9)"}, ${(-9 * gl.a).toFixed(1)}px 0 ${onCoral ? "rgba(110,22,24,.7)" : "rgba(110,22,24,.9)"}` : "none" });
        PF.show($("#three"), canvasOn);
        if (canvasOn) st.render();

        // Viewfinder reticle on the phone (02 Problema), label blinking on the beat.
        PF.show($("#reticle"), reticle);
        if (reticle) {
          const r = projectBox(S.phone, 0.95, 1.8), pad = 26;
          PF.css($("#reticle"), { left: `${(r.x0 - pad).toFixed(1)}px`, top: `${(r.y0 - pad).toFixed(1)}px`, width: `${(r.x1 - r.x0 + pad * 2).toFixed(1)}px`, height: `${(r.y1 - r.y0 + pad * 2).toFixed(1)}px` });
          PF.css($("#reticle span"), { opacity: Math.floor((t - SC[1].from) / (b.beat * 0.5)) % 2 ? "0.35" : "1" });
        }

        // Shockwave from the logo when it turns solid.
        const rg = PF.ring(t, b(11, 3), { length: 0.75, to: 700 });
        PF.show($("#ring"), rg.opacity > 0);
        const ry = rg.opacity > 0 ? (projectBox(S.logoGroup, 0, 0).y0) : 700;
        PF.css($("#ring"), { left: `${540 - rg.r}px`, top: `${ry - rg.r}px`, width: `${rg.r * 2}px`, height: `${rg.r * 2}px`, opacity: rg.opacity.toFixed(3), borderWidth: `${(rg.width * 1.4).toFixed(2)}px` });

        // Words: slammed on the beat, out before every handoff.
        const H1 = b(2, 4, 0.75), P1 = b(3, 4) - 0.1, P2 = b(4, 3) - 0.1, P3 = b(5, 1) - 0.12;
        slam("#w1a", t, -0.12, H1);
        slam("#w1b", t, b(1, 2), H1, 1.6);
        slam("#w1c", t, b(2, 1), H1);
        slam("#w1d", t, b(2, 2), H1);
        slam("#w2a", t, b(3, 1), P1); slam("#w2b", t, b(3, 1, 0.5), P1, 1.5);
        slam("#w2c", t, b(3, 4), P2); slam("#w2d", t, b(3, 4, 0.5), P2, 1.5);
        slam("#w2e", t, b(4, 3), P3); slam("#w2f", t, b(4, 3, 0.5), P3, 1.5);
        slam("#w3a", t, BASTA - 0.04, b(6, 1) - 0.32, 1.8);
        slam("#w4a", t, b(6, 1), b(7, 4, 0.6));
        slam("#w4b", t, b(6, 1, 0.5), b(7, 4, 0.6));
        slam("#w4c", t, b(6, 2), b(7, 4, 0.6));
        slam("#w4d", t, b(6, 3), b(7, 4, 0.6), 1.5);
        slam("#w4e", t, b(8, 1), b(8, 4, 0.3));
        slam("#w4f", t, b(8, 2), b(8, 4, 0.3), 1.6);
        slam("#w5a", t, b(9, 1), BENE2 - 0.12);
        slam("#w5b", t, b(9, 2), BENE2 - 0.12, 1.5);
        slam("#w5c", t, BENE2, b(10, 4, 0.3));
        slam("#w5d", t, b(10, 2), b(10, 4, 0.3), 1.6);
        slam("#w6a", t, b(11, 4), CUES.duration + 1);
        slam("#w6b", t, b(12, 1), CUES.duration + 1);

        // Transitions: (hard cuts on 3.1, 5.1, 5.3 and 10.1), coral iris after the silence, cream flood up, coral iris from the prism.
        const wipe = $("#wipe");
        const T = [
          { at: SC[3].from, len: 0.3, color: C.coral, kind: "iris", y: 1180 },
          { at: SC[4].from, len: 0.24, color: C.cream, kind: "up" },
          { at: SC[5].from, len: 0.3, color: C.coral, kind: "iris", y: 1440 },
        ].find((x) => t >= x.at - x.len && t < x.at);
        PF.show(wipe, !!T);
        if (T) {
          const p = PF.bezier(0.7, 0, 0.2, 1)(PF.progress(t, T.at - T.len, T.len));
          PF.css(wipe, { background: T.color });
          if (T.kind === "iris") PF.iris(wipe, p, 540, T.y, W, H); else PF.flood(wipe, p, T.kind);
        }

        PF.css($("#vignette"), { background: PF.vignette(bg === C.cream ? 0.1 : 0.3, bg === C.coral ? "110,22,24" : "0,0,0") });
        hud.set({ tl: LABEL[k], tr: k < 3 ? "● REC" : "Manuvo", bl: "Rimini · Romagna", br: PF.timecode(t, 30) }, t);
        PF.grain($("#grain"), t, { alpha: 0.07 });
      }

      PF.film({
        duration: CUES.duration,
        setup,
        draw,
        waitFor: [PF.signal("three"), PF.loadImages({ mark: "assets/images/logo-mark.svg", markCream: "assets/images/logo-mark-cream.svg" })],
        // Registered only after setup and the clock are built (fonts first).
        register: (tl) => {
          window.__timelines["main"] = tl;
        },
      });
    </script>
  </body>
</html>
