<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Manuvo · Story quiz reale: l'artigiano piu difficile</title>
    <!-- Vendored runtimes: nothing loads from the network at render time. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/film.js"></script>
    <script src="kit/motion.js"></script>
    <script src="kit/words.js"></script>
    <script src="kit/draw.js"></script>
    <script src="kit/fx.js"></script>
    <script src="kit/three.js"></script>
    <script src="kit/debug.js"></script>
    <script src="assets/logo-mark-data.js"></script>
    <script src="cues.js"></script>
    <style>
      @font-face { font-family: "Bricolage"; src: url("assets/fonts/BricolageGrotesque.woff2") format("woff2"); font-weight: 200 800; font-display: block; }
      @font-face { font-family: "Geist"; src: url("assets/fonts/Geist.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      @font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1b1e24; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1b1e24; color: #faf8f4; font-family: "Geist", sans-serif; }
      .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      #cam { position: absolute; inset: 0; }
      /* The Kling plate carries the whole film, full bleed. */
      #plate { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 50% 58%; }
      .head { position: absolute; left: 60px; right: 120px; text-align: center; font-family: "Bricolage", sans-serif; font-weight: 800; text-transform: uppercase; line-height: 1; letter-spacing: -0.025em; white-space: nowrap; visibility: hidden; transform-origin: 50% 50%; }
      .handle { font-family: "Geist", sans-serif; font-weight: 700; text-transform: none; letter-spacing: -0.01em; }
      #ring { position: absolute; border-radius: 50%; border: 6px solid #FF5758; visibility: hidden; }
      /* Legibility overlays only, no grade on the footage itself:
         a soft light wash where the quiz sticker lands, a dark foot where the type sits. */
      #scrim-sticker { position: absolute; left: 0; top: 0; width: 1080px; height: 900px; }
      #scrim-bot { position: absolute; left: 0; top: 1240px; width: 1080px; height: 680px; }
      /* The coral slab that lands behind the punch line. */
      #slab { position: absolute; left: 0; width: 1080px; background: #FF5758; visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div id="cam">
        <video id="plate" class="clip" data-start="0" data-duration="10" muted playsinline data-layout-ignore src="assets/video/plate.mp4"></video>
        <canvas id="three" data-layout-allow-overflow width="1080" height="1920" class="full" style="visibility:hidden"></canvas>
        <div id="scrim-sticker" data-layout-ignore></div>
        <div id="scrim-bot" data-layout-ignore></div>
        <div id="slab" data-layout-ignore></div>
        <div id="ring" data-layout-ignore></div>
        <div id="words" class="full">
          <!-- The type lives in the lower third: the quiz sticker takes the sky. -->
          <div id="w1" class="head" style="top:1442px;font-size:112px;color:#faf8f4">Secondo te</div>
          <div id="w2a" class="head" style="top:1404px;font-size:100px;color:#faf8f4">Qual è</div>
          <div id="w2b" class="head" style="top:1516px;font-size:100px;color:#faf8f4">l'artigiano</div>
          <div id="w3a" class="head" style="top:1404px;font-size:100px;color:#faf8f4">più difficile</div>
          <div id="w3b" class="head" style="top:1516px;font-size:100px;color:#faf8f4">da trovare</div>
          <div id="w4" class="head" style="top:1424px;font-size:150px;color:#1b1e24">a Rimini?</div>
          <!-- The recap and the CTA land once and hold to the end. -->
          <div id="r1" class="head" data-layout-allow-occlusion style="top:1400px;font-size:54px;color:#faf8f4">L'artigiano più difficile</div>
          <div id="r2" class="head" data-layout-allow-occlusion style="top:1466px;font-size:54px;color:#faf8f4">da trovare a Rimini?</div>
          <div id="cta" class="head" data-layout-allow-occlusion style="top:1556px;font-size:44px;color:#FF5758">Vota qui sopra e scrivimi perché</div>
          <div id="pill" class="head" style="top:1762px;font-size:48px"><span class="handle" style="color:#FF5758;background:#1b1e24;border-radius:999px;padding:8px 32px 12px">@manuvo.it</span></div>
        </div>
      </div>
      <div id="wipe" class="full" data-layout-ignore style="visibility:hidden"></div>
      <div id="vignette" class="full" data-layout-ignore></div>
      <canvas id="grain" class="full" width="540" height="960" data-layout-ignore style="width:100%;height:100%;mix-blend-mode:overlay"></canvas>
      <script type="importmap">
        { "imports": { "three": "./vendor/three/three.module.min.js" } }
      </script>
      <script type="module">
        import * as THREE from "three";
        import { EffectComposer } from "./vendor/three/addons/postprocessing/EffectComposer.js";
        import { RenderPass } from "./vendor/three/addons/postprocessing/RenderPass.js";
        import { UnrealBloomPass } from "./vendor/three/addons/postprocessing/UnrealBloomPass.js";
        import { OutputPass } from "./vendor/three/addons/postprocessing/OutputPass.js";
        import { RoomEnvironment } from "./vendor/three/addons/environments/RoomEnvironment.js";
        import { SVGLoader } from "./vendor/three/addons/loaders/SVGLoader.js";
        window.THREE = THREE;
        window.THREE_ADDONS = { EffectComposer, RenderPass, UnrealBloomPass, OutputPass, RoomEnvironment, SVGLoader };
        PF.signal("three").resolve();
      </script>
      <script>
        const $ = (s) => document.querySelector(s);
        const W = CUES.width, H = CUES.height;
        const b = PF.grid(CUES.grid);
        const at = (a) => b(a[0], a[1], a[2] || 0);
        const C = { cream: "#faf8f4", ink: "#1b1e24", coral: "#FF5758", coralText: "#C6383A", deep: "#6E1618" };
        const SIXTH = PF.ease("cubic-bezier(.16,1,.3,1)");
        const TURN = Math.PI / 3;
        const LOGO_IN = () => at([5, 3]);
        let st;
        const S = {};

        function fit(el, max = 860) {
          PF.show(el, true);
          const r = document.createRange(); r.selectNodeContents(el);
          const w = r.getBoundingClientRect().width;
          if (w > max) el.style.fontSize = (parseFloat(el.style.fontSize) * max / w).toFixed(1) + "px";
          PF.show(el, false);
        }

        function setup() {
          document.querySelectorAll(".head").forEach((el) => fit(el));
          st = PF.three.stage($("#three"), { width: W, height: H, fov: 50, env: true, bloom: { strength: 0.5, radius: 0.6, threshold: 1.2 }, exposure: 0.95 });
          const THREE = st.THREE, A = window.THREE_ADDONS;
          st.renderer.toneMapping = THREE.NoToneMapping;

          const s = st.newScene();
          s.background = new THREE.Color(C.coral);
          s.environmentIntensity = 0.45;
          PF.three.lights(st, { scene: s, ground: C.deep, fill: 0.6, key: 1.3, keyPos: [-5, 7, 8] });
          S.s = s;

          /* The lockup: manuvo/public/logo-mark.svg extruded, reversed cream on coral. */
          const svg = new A.SVGLoader().parse(window.MANUVO_MARK_SVG);
          const shapes = [];
          svg.paths.forEach((p) => {
            const f = (p.userData.style.fill || "").replace(/\s/g, "");
            if (f === "rgb(255,87,88)" || f.toLowerCase() === "#ff5758") shapes.push(...A.SVGLoader.createShapes(p));
          });
          const geo = new THREE.ExtrudeGeometry(shapes, { depth: 40, bevelEnabled: true, bevelThickness: 6, bevelSize: 4, bevelSegments: 4, curveSegments: 24 });
          geo.computeBoundingBox();
          const bb = geo.boundingBox, cx = (bb.min.x + bb.max.x) / 2, cy = (bb.min.y + bb.max.y) / 2;
          geo.translate(-cx, -cy, -20);
          const k = 1.25 / (bb.max.x - bb.min.x);
          S.logoFace = new THREE.MeshBasicMaterial({ color: C.cream, toneMapped: false, fog: false, transparent: true });
          S.logoSide = PF.three.mat("gloss", C.deep, { transparent: true });
          S.logo = new THREE.Mesh(geo, [S.logoFace, S.logoSide]);
          S.logo.scale.set(k, -k, k);
          S.logoGroup = new THREE.Group();
          S.logoGroup.add(S.logo);
          s.add(S.logoGroup);
          st.camera.position.set(0, 0, 4.2);
          st.camera.lookAt(0, 0, 0);
        }

        function draw(t) {
          const logoOn = t >= LOGO_IN() - 0.25;

          /* The plate: the Kling take, untouched. Its own slow push in is the camera move;
             adding a second one would crop it and push her chin into the type. */
          PF.css($("#plate"), { visibility: logoOn ? "hidden" : "inherit" });

          /* Legibility overlays only; the footage itself is never graded. */
          PF.css($("#scrim-sticker"), { background: "linear-gradient(to bottom, rgba(250,248,244,0.42) 0%, rgba(250,248,244,0.38) 72%, rgba(250,248,244,0) 100%)", opacity: logoOn ? 0 : 1 });
          PF.css($("#scrim-bot"), { background: "linear-gradient(to bottom, rgba(27,30,36,0) 0%, rgba(27,30,36,0.24) 26%, rgba(27,30,36,0.74) 48%, rgba(27,30,36,0.93) 100%)", opacity: logoOn ? 0 : 1 });

          /* The coral slab lands behind the punch line, then leaves upward. */
          const slab = $("#slab");
          const sIn = PF.bezier(0.6, 0, 0.2, 1)(PF.progress(t, at([4, 1]) - 0.08, 0.3));
          const sOut = PF.bezier(0.6, 0, 0.2, 1)(PF.progress(t, at([5, 1]) - 0.08, 0.28));
          const sh = Math.max(0, sIn - sOut);
          PF.show(slab, sh > 0.01 && !logoOn);
          if (sh > 0.01) PF.css(slab, { top: 1390 + (1 - sh) * 112 + "px", height: 224 * sh + "px", opacity: 1 });

          /* The lockup takes the frame: the coral scene replaces the plate. */
          PF.css($("#three"), { visibility: logoOn ? "inherit" : "hidden" });
          if (logoOn) {
            st.use(S.s);
            const lu = PF.step(t - LOGO_IN(), { stiffness: 46, damping: 13 });
            const turn = SIXTH(PF.progress(t, LOGO_IN(), 0.48));
            const click = PF.progress(t, at([6, 1]), 0.34);
            const pop = click > 0 && click < 1 ? Math.sin(click * Math.PI) * 0.05 : 0;
            S.logoGroup.scale.setScalar(PF.lerp(0.62, 1, lu) + pop);
            S.logoGroup.rotation.set(0, PF.lerp(-0.7, 0, lu), PF.lerp(-TURN, 0, turn));
            S.logoGroup.position.set(0, PF.lerp(-0.22, 0, lu), 0);
            S.logoFace.opacity = S.logoSide.opacity = lu;
            st.render();
          }

          /* Words: one idea at a time, then the recap and CTA that hold. */
          const slam = (el, cue, win, o) => {
            const on = t >= cue && t < cue + win;
            PF.show(el, on);
            if (on) PF.slamStyle(el, PF.slam(t, cue, o || { from: 1.3, length: 0.2, blur: 16 }));
          };
          slam($("#w1"), b(1, 1), at([2, 1]) - b(1, 1));
          slam($("#w2a"), b(2, 1), at([3, 1]) - 0.16 - b(2, 1));
          slam($("#w2b"), b(2, 3), at([3, 1]) - 0.16 - b(2, 3));
          slam($("#w3a"), b(3, 1), at([4, 1]) - 0.16 - b(3, 1));
          slam($("#w3b"), b(3, 3), at([4, 1]) - 0.16 - b(3, 3));
          slam($("#w4"), b(4, 1), at([5, 1]) - 0.1 - b(4, 1), { from: 1.4, length: 0.22, blur: 20 });
          [["#r1", b(5, 1)], ["#r2", b(5, 1, 0.5)], ["#cta", b(5, 2)], ["#pill", b(6, 1)]].forEach(([sel, cue]) => {
            const el = $(sel), on = t >= cue;
            PF.show(el, on);
            if (on) PF.slamStyle(el, PF.slam(t, cue, { from: 1.14, length: 0.2, blur: 10 }));
          });
          // On the coral lockup the recap flips to ink: cream on coral is under 3:1.
          const onCoral = logoOn;
          [["#r1", C.cream], ["#r2", C.cream], ["#cta", C.coral]].forEach(([sel, base]) => {
            PF.css($(sel), { color: onCoral ? C.ink : base });
          });

          /* One coral flood hands the frame to the lockup. */
          const wipe = $("#wipe");
          const fl = PF.progress(t, LOGO_IN() - 0.22, 0.34);
          if (fl > 0 && fl < 1) {
            PF.show(wipe, true); PF.css(wipe, { background: C.coral, clipPath: null });
            PF.flood(wipe, PF.bezier(0.7, 0, 0.2, 1)(fl), "up");
          } else PF.show(wipe, false);

          /* One shockwave on the punch, one on the landing. */
          const ringEl = $("#ring");
          const rg = PF.ring(t, at([4, 1]), { length: 0.6, to: 820 });
          const rg2 = PF.ring(t, at([6, 1]), { length: 0.58, to: 640 });
          const r = rg.opacity > 0 ? rg : rg2;
          PF.show(ringEl, r.opacity > 0);
          if (r.opacity > 0) {
            const cy = r === rg ? 1480 : 900;
            PF.css(ringEl, { left: (W / 2 - r.r) + "px", top: (cy - r.r) + "px", width: r.r * 2 + "px", height: r.r * 2 + "px", opacity: r.opacity, borderColor: r === rg ? C.cream : C.ink, borderWidth: Math.max(2, 7 * r.opacity) + "px" });
          }

          /* One shake on the punch. */
          const shk = PF.shake(t, [at([4, 1])], { amp: 13, decay: 0.3, freq: 22, rot: 0.4 });
          PF.css($("#cam"), { transform: `translate(${shk.x.toFixed(2)}px, ${shk.y.toFixed(2)}px) rotate(${shk.r.toFixed(3)}deg)` });

          PF.grain($("#grain"), t, { alpha: 0.045 });
          PF.css($("#vignette"), { background: PF.vignette(0.26, "0,0,0") });
        }

        PF.film({
          duration: CUES.duration, setup, draw,
          waitFor: [PF.signal("three")],
          register: (tl) => { window.__timelines["main"] = tl; },
        });
      </script>
    </div>
  </body>
</html>
