    <style>
      /* Manuvo fonts (manuvo/src/app/layout.tsx): Bricolage Grotesque for titles, Geist for UI, Geist Mono for the HUD. */
      @font-face { font-family: "Bricolage"; src: url("assets/fonts/BricolageGrotesque.woff2") format("woff2"); font-weight: 200 800; font-display: block; }
      @font-face { font-family: "Geist"; src: url("assets/fonts/Geist.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      @font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1b1e24; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1b1e24; color: #faf8f4; font-family: "Geist", sans-serif; }
      .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      #cam { position: absolute; inset: 0; }
      /* Giant slammed lines: the Manuvo display face, 800, uppercase, tight. */
      .head { position: absolute; left: 60px; right: 120px; text-align: center; font-family: "Bricolage", sans-serif; font-weight: 800; text-transform: uppercase; line-height: 1; letter-spacing: -0.025em; white-space: nowrap; visibility: hidden; transform-origin: 50% 50%; }
      /* The one-contact precision and the handle: UI face, not the display face. */
      .note { position: absolute; left: 60px; right: 120px; text-align: center; font-family: "Geist", sans-serif; font-weight: 500; text-transform: none; letter-spacing: -0.005em; white-space: nowrap; visibility: hidden; transform-origin: 50% 50%; }
      .handle { font-family: "Geist", sans-serif; font-weight: 700; text-transform: none; letter-spacing: -0.01em; }
      /* The doubt counter in 02: HUD face, so it reads as a tally and not as a headline. */
      #count { position: absolute; left: 60px; right: 120px; text-align: center; font-family: "Geist Mono", monospace; font-weight: 700; letter-spacing: 0.06em; white-space: nowrap; visibility: hidden; }
      #ring { position: absolute; border-radius: 50%; border: 6px solid #faf8f4; visibility: hidden; }
      /* Grain blended in overlay so cream and coral decode exact (BRAND.md trap). */
      #grain { mix-blend-mode: overlay; }

    <script>
      const b = PF.grid(CUES.grid);
      const $ = PF.$;
      const W = CUES.width, H = CUES.height;
      // Manuvo palette (manuvo/src/app/globals.css). Coral is the one highlight; red-900 for coral text on cream (contrast).
      const C = { cream: "#faf8f4", ink: "#1b1e24", coral: "#FF5758", coralText: "#C6383A", deep: "#6E1618" };
      const at = (c) => b(c[0], c[1] || 1, c[2] || 0);
      const SC = CUES.scenes.map((s) => ({ name: s.name, from: at(s.from), to: at(s.to) }));
      // Avvita (enter) and click (success) from the Manuvo motion identity.
      const AVVITA = PF.ease("cubic-bezier(.16,1,.3,1)"), CLICK = PF.ease("cubic-bezier(.34,1.4,.64,1)");
      const TAGLIO = b(5, 3);   // the dry cut onto MASSIMO 3.
      const CREDITI = b(10, 1); // the hard cut from cream to ink
      const LABEL = ["01 — Il contatto", "02 — Il dubbio", "03 — Il taglio", "04 — Max 3", "05 — 5 crediti", "06 — Manuvo"];
      let st, hud, S = {};

      /* ---------- helpers ---------- */
      function sceneAt(t) { let k = 0; SC.forEach((s, i) => { if (t >= s.from) k = i; }); return k; }
      // A slammed line: lands at `on`, leaves (quick blur) at `off`.
      function slam(id, t, on, off, from = 1.3) {
        const el = $(id);
        const live = t >= on && t < off + 0.12;
        PF.show(el, live);
        if (!live) return;
        const s = PF.slam(t, on, { from, length: 0.2, blur: 16 });
        const leave = PF.clamp01((t - off) / 0.12);
        PF.css(el, {
          transform: `scale(${(s.scale * (1 + leave * 0.08)).toFixed(4)})`,
          opacity: (s.opacity * (1 - leave)).toFixed(3),
          filter: s.blur + leave * 14 > 0.05 ? `blur(${(s.blur + leave * 14).toFixed(2)}px)` : "none",
        });
      }
      // A quiet line that rises and fades (the precision under 5 crediti, the handle).
      function rise(id, t, on, off, dy = 26) {
        const el = $(id);
        const live = t >= on && t < off + 0.16;
        PF.show(el, live);
        if (!live) return;
        const e = AVVITA(PF.clamp01((t - on) / 0.42));
        const leave = PF.clamp01((t - off) / 0.16);
        PF.css(el, { transform: `translateY(${((1 - e) * dy).toFixed(2)}px)`, opacity: (e * (1 - leave)).toFixed(3) });
      }
      function scene(bg, far = 34) {
        const THREE = st.THREE, s = st.newScene();
        s.background = new THREE.Color(bg);
        s.fog = new THREE.Fog(bg, 9, far);
        s.environmentIntensity = 0.55;
        PF.three.lights(st, { scene: s, ground: bg, fill: 0.5, key: 1.6, keyPos: [-4, 8, 6] });
        return s;
      }
      function unlit(mesh) { mesh.material.toneMapped = false; return mesh; }
      // Shrink a line until it fits the safe width (measured after fonts load).
      function fit(el, max = 880) {
        PF.show(el, true);
        const r = document.createRange(); r.selectNodeContents(el);
        const w = r.getBoundingClientRect().width;
        if (w > max) el.style.fontSize = (parseFloat(el.style.fontSize) * max / w).toFixed(1) + "px";
        PF.show(el, false);
      }
      // An anonymous contact card: the shape of a lead, never a real name or number.
      function cardTex(kind) {
        return PF.three.canvasTexture(st, 640, 240, (c, w, h) => {
          const coral = kind === "richiesta";
          c.fillStyle = coral ? C.coral : C.cream;
          c.beginPath(); c.roundRect(0, 0, w, h, 36); c.fill();
          const ink = coral ? C.cream : C.ink;
          // Avatar disc
          c.fillStyle = coral ? "rgba(250,248,244,.30)" : "rgba(27,30,36,.12)";
          c.beginPath(); c.arc(112, h / 2, 62, 0, Math.PI * 2); c.fill();
          // Two redacted lines: a name and a number, deliberately unreadable.
          c.fillStyle = coral ? "rgba(250,248,244,.85)" : "rgba(27,30,36,.78)";
          c.beginPath(); c.roundRect(208, 74, 300, 26, 13); c.fill();
          c.fillStyle = coral ? "rgba(250,248,244,.45)" : "rgba(27,30,36,.34)";
          c.beginPath(); c.roundRect(208, 126, 210, 22, 11); c.fill();
          // The lock chip on the right: a contact you have to unlock.
          c.fillStyle = coral ? "rgba(250,248,244,.22)" : "rgba(255,87,88,.14)";
          c.beginPath(); c.roundRect(w - 118, h / 2 - 34, 74, 68, 22); c.fill();
          c.fillStyle = coral ? C.cream : C.coral;
          c.beginPath(); c.roundRect(w - 96, h / 2 - 6, 30, 24, 7); c.fill();
          c.lineWidth = 7; c.strokeStyle = coral ? C.cream : C.coral;
          c.beginPath(); c.arc(w - 81, h / 2 - 8, 11, Math.PI, 0); c.stroke();
          void ink;
        });
      }
      // A hexagon token (the brand element): exact-swatch caps, glossy sides.
      function hexToken(r, thick, capHex, sideHex) {
        const THREE = st.THREE;
        const cap = new THREE.MeshBasicMaterial({ color: capHex, toneMapped: false, fog: false });
        return new THREE.Mesh(new THREE.CylinderGeometry(r, r, thick, 6, 1), [PF.three.mat("gloss", sideHex), cap, cap]);
      }

      function setup() {
        hud = PF.hud($("#hud-layer"), { size: 22, top: CUES.safe.top - 60, bottom: CUES.safe.bottom - 60, color: "rgba(250,248,244,.75)" });
        // Rich 3D: env map, bloom only above 1.0 (the glow material), fov 50 for 9:16.
        st = PF.three.stage($("#three"), { width: W, height: H, fov: 50, env: true, bloom: { strength: 0.85, radius: 0.6, threshold: 1.0 }, exposure: 0.95 });
        const THREE = st.THREE, A = window.THREE_ADDONS;

        /* 01 Hook: one coral request low in frame, identical contact cards stacking onto it. */
        S.s1 = scene(C.ink, 40);
        S.richiesta = PF.three.card(st, cardTex("richiesta"), 3.4);
        S.richiesta.rotation.x = -Math.PI / 2 + 0.26;
        S.richiesta.position.set(0, -0.6, 0);
        S.s1.add(S.richiesta);
        // Nine cards land one after another, each on its own beat: the stack grows.
        S.stack = [1.5, 1.75, 2.0, 2.25, 2.5, 2.75, 2.9, 3.05, 3.2].map((beat, i) => {
          const m = PF.three.card(st, cardTex("contatto"), 3.4);
          m.rotation.x = -Math.PI / 2 + 0.26;
          S.s1.add(m);
          const r = PF.random(i * 23 + 3);
          return { m, on: b(1, 1) + beat * b.beat, dx: (r() - 0.5) * 0.5, dz: (r() - 0.5) * 0.34, rz: (r() - 0.5) * 0.16, i };
        });
        S.dust1 = PF.three.particles(st, 420, {
          scene: S.s1, size: 0.055, color: (i) => (i % 4 ? C.cream : C.coral),
          pos: (i, t, o) => { const r = PF.random(i * 13 + 1); o.x = (r() - 0.5) * 13; o.y = -5 + ((r() * 11 + t * (0.4 + r() * 0.5)) % 11); o.z = -1 - r() * 9; },
        });
        unlit(S.dust1.points);

        /* 02 Il dubbio: the stack fans out into a wall of identical cards. */
        S.s2 = scene(C.coral, 38);
        S.wallTex = cardTex("contatto");
        S.wall = [];
        for (let i = 0; i < 18; i++) {
          const m = PF.three.card(st, S.wallTex, 2.5);
          const col = i % 3, row = Math.floor(i / 3);
          m.position.set((col - 1) * 2.75, 3.1 - row * 1.26, -0.4 - row * 0.1);
          m.rotation.z = (PF.random(i * 7 + 2)() - 0.5) * 0.1;
          S.s2.add(m);
          S.wall.push({ m, on: b(3, 1) + i * 0.085, i });
        }
        S.dust2 = PF.three.particles(st, 240, {
          scene: S.s2, size: 0.05, color: (i) => (i % 3 ? C.cream : C.deep),
          pos: (i, t, o) => { const r = PF.random(i * 29 + 5); o.x = (r() - 0.5) * 13; o.y = 5 - ((r() * 11 + t * (0.3 + r() * 0.4)) % 11); o.z = -2 - r() * 8; },
        });
        unlit(S.dust2.points);

        /* 03 Il taglio: the wall bursts into fragments; the number lands in the DOM. */
        S.s3 = scene(C.ink, 36);
        S.burst = PF.three.particles(st, 520, {
          scene: S.s3, size: 0.085, color: (i) => (i % 5 ? C.cream : C.coral),
          pos: (i, t, o) => {
            const r = PF.random(i * 17 + 9);
            const a = r() * Math.PI * 2, e = (r() - 0.5) * 1.5, sp = 2.4 + r() * 8;
            const u = PF.clamp01((t - b(5, 1)) / 1.1);
            const d = u * sp;
            o.x = Math.cos(a) * Math.cos(e) * d; o.y = Math.sin(e) * d * 0.8; o.z = -1 + Math.sin(a) * Math.cos(e) * d * 0.7;
          },
        });
        unlit(S.burst.points);
        // The three that survive the burst, settling toward the lens.
        S.three3 = [-1, 0, 1].map((k, i) => {
          const m = hexToken(0.62, 0.2, C.coral, C.deep);
          m.rotation.x = Math.PI / 2;
          S.s3.add(m);
          return { m, k, i };
        });

        /* 04 La soluzione: the hexagon shield locks, three cream tokens settle in a row. */
        S.s4 = scene(C.coral, 36);
        S.shield = hexToken(1.3, 0.3, C.cream, C.coralText);
        S.shield.rotation.x = Math.PI / 2;
        S.shield.position.y = -1.0;
        S.s4.add(S.shield);
        S.tokens = [0, 1, 2].map((i) => {
          const m = hexToken(0.5, 0.18, C.cream, C.coralText);
          m.rotation.x = Math.PI / 2;
          m.position.set((i - 1) * 1.25, -1.62, 0.5);
          S.s4.add(m);
          return { m, on: b(6, 2) + i * b.beat, i };
        });
        S.dust4 = PF.three.particles(st, 220, {
          scene: S.s4, size: 0.05, color: (i) => (i % 3 ? C.cream : C.deep),
          pos: (i, t, o) => { const r = PF.random(i * 31 + 4); o.x = (r() - 0.5) * 12; o.y = -5 + ((r() * 11 + t * (0.35 + r() * 0.4)) % 11); o.z = -2 - r() * 8; },
        });
        unlit(S.dust4.points);

        /* 05 Beneficio: a hexagon prism turning a sixth on every beat (ink on cream, then coral on ink). */
        S.s5a = scene(C.cream);
        S.prismA = hexToken(1.6, 0.7, C.ink, C.ink);
        S.s5a.add(S.prismA);
        S.s5b = scene(C.ink);
        S.prismB = hexToken(1.6, 0.7, C.coral, C.coralText);
        S.s5b.add(S.prismB);
        S.dust5 = PF.three.particles(st, 300, {
          scene: S.s5b, size: 0.06, color: (i) => (i % 3 ? C.coral : C.cream),
          pos: (i, t, o) => { const r = PF.random(i * 31 + 8); o.x = (r() - 0.5) * 12; o.y = -6 + ((r() * 12 + t * (0.5 + r() * 0.5)) % 12); o.z = -1 - r() * 9; },
        });
        unlit(S.dust5.points);

        /* 06 Manuvo: particles converge into the logo (manuvo/public/logo.svg), then the extruded logo. */
        S.s6 = scene(C.coral);
        const svg = new A.SVGLoader().parse(window.MANUVO_LOGO_SVG);
        const shapes = [];
        svg.paths.forEach((p) => { const f = (p.userData.style.fill || "").replace(/\s/g, ""); if (f === "rgb(255,87,88)" || f.toLowerCase() === "#ff5758") shapes.push(...A.SVGLoader.createShapes(p)); });
        const geo = new THREE.ExtrudeGeometry(shapes, { depth: 40, bevelEnabled: true, bevelThickness: 6, bevelSize: 4, bevelSegments: 4, curveSegments: 24 });
        geo.computeBoundingBox();
        const bb = geo.boundingBox, cx = (bb.min.x + bb.max.x) / 2, cy = (bb.min.y + bb.max.y) / 2;
        geo.translate(-cx, -cy, -20);
        const k = 2.15 / (bb.max.x - bb.min.x);
        // Reversed mark (cream on coral), as the app does on coral (ComingSoon.tsx: brightness-0 invert).
        S.logoFace = new THREE.MeshBasicMaterial({ color: C.cream, toneMapped: false, fog: false, transparent: true });
        S.logoSide = PF.three.mat("gloss", C.deep, { transparent: true });
        S.logo = new THREE.Mesh(geo, [S.logoFace, S.logoSide]);
        S.logo.scale.set(k, -k, k);
        S.logoGroup = new THREE.Group(); S.logoGroup.add(S.logo); S.s6.add(S.logoGroup);
        const flat = new THREE.ShapeGeometry(shapes, 12); flat.translate(-cx, -cy, 0);
        const sampler = new A.MeshSurfaceSampler(new THREE.Mesh(flat)).setRandomGenerator(PF.random(5)).build();
        const v = new THREE.Vector3();
        S.target = [];
        for (let i = 0; i < 2600; i++) { sampler.sample(v); S.target.push({ x: v.x * k, y: -v.y * k }); }
        S.swarm = PF.three.particles(st, S.target.length, {
          scene: S.s6, size: 0.075, color: (i) => (i % 9 === 0 ? C.deep : C.cream),
          pos: (i, t, o) => {
            const r = PF.random(i * 17 + 2);
            const a = r() * Math.PI * 2, e = (r() - 0.5) * Math.PI, R = 2.5 + r() * 5, delay = r();
            const spin = a + (t - b(11, 1)) * 0.6;
            const sx = R * Math.cos(e) * Math.cos(spin), sy = R * Math.sin(e) * 0.9, sz = R * Math.cos(e) * Math.sin(spin) - 1.5;
            const u = PF.step(t - b(11, 1) + 0.25 - delay * 0.45, { stiffness: 60, damping: 12 });
            const g = S.target[i];
            o.x = PF.lerp(sx, g.x, u); o.y = PF.lerp(sy, g.y, u); o.z = PF.lerp(sz, 0.12, u);
          },
        });
        unlit(S.swarm.points);
        S.logoGroup.add(S.swarm.points);
        S.dust6 = PF.three.particles(st, 220, {
          scene: S.s6, size: 0.06, color: (i) => (i % 3 ? C.cream : C.deep),
          pos: (i, t, o) => { const r = PF.random(i * 37 + 6); o.x = (r() - 0.5) * 12; o.y = 6 - ((r() * 12 + t * (0.3 + r() * 0.4)) % 12); o.z = -3 - r() * 8; },
        });
        unlit(S.dust6.points);

        // Every line fits the safe width, measured once the display face has loaded.
        ["#w1a", "#w1b", "#w1c", "#w1d", "#w2a", "#w2b", "#w2c", "#w2d", "#w3a", "#w4a", "#w4b", "#w4c", "#w4d", "#w4e", "#w4f", "#w5a", "#w5b", "#w5c", "#w5d", "#w5e", "#w6a", "#w6b"].forEach((id) => fit($(id)));
        $("#vignette").style.background = PF.vignette(0.3, "0,0,0");
        PF.debug({ grid: b, safe: CUES.safe });
      }

      function draw(t) {
        const k = sceneAt(t);
        let bg = C.ink;

        /* ---------- 01 Hook ---------- */
        if (k === 0) {
          st.use(S.s1);
          S.richiesta.position.y = -0.6;
          S.stack.forEach((c) => {
            // Each card drops onto the pile on its own beat and stays.
            const u = PF.step(t - c.on, { stiffness: 90, damping: 14 });
            c.m.visible = u > 0.001;
            c.m.position.set(c.dx * u, -0.52 + 0.055 * (c.i + 1) * u + (1 - u) * 7, c.dz * u);
            c.m.rotation.z = c.rz * u;
            c.m.material.opacity = PF.clamp01(u * 3);
          });
          S.dust1.update(t);
          PF.three.shots(st.camera, t, [
            { at: 0, azimuth: -28, elevation: 24, radius: 7.2, target: [0, 1.5, 0], drift: { azimuth: 9, radius: 1.0 } },
            { at: b(1, 3), azimuth: 14, elevation: 14, radius: 5.2, target: [0, 1.3, 0], drift: { azimuth: -7, elevation: 5 } },
            { at: b(2, 1), azimuth: -6, elevation: 30, radius: 8.4, target: [0, 1.8, 0], drift: { radius: 1.1 } },
            { at: b(2, 3), azimuth: 26, elevation: 18, radius: 6.8, target: [0, 1.6, 0], drift: { azimuth: -10 } },
          ]);
        }

        /* ---------- 02 Il dubbio ---------- */
        if (k === 1) {
          bg = C.coral;
          st.use(S.s2);
          S.wall.forEach((c) => {
            const u = PF.step(t - c.on, { stiffness: 80, damping: 15 });
            c.m.visible = u > 0.001;
            c.m.material.opacity = PF.clamp01(u * 2.2);
            const col = c.i % 3, row = Math.floor(c.i / 3);
            c.m.position.set((col - 1) * 2.75 * (0.6 + 0.4 * u), (3.1 - row * 1.26) * u + (1 - u) * 0.4, -0.4 - row * 0.1);
          });
          S.dust2.update(t);
          PF.three.shots(st.camera, t, [
            { at: b(3, 1), azimuth: -10, elevation: 6, radius: 9.4, target: [0, 3.0, 0], drift: { azimuth: 7, radius: -1.2 } },
            { at: b(3, 3), azimuth: 16, elevation: -4, radius: 6.6, target: [0, 2.4, 0], drift: { azimuth: -9 } },
            { at: b(4, 1), azimuth: -4, elevation: 10, radius: 11.4, target: [0, 3.4, 0], drift: { radius: -1.6 } },
            { at: b(4, 3), azimuth: 8, elevation: 2, radius: 8.2, target: [0, 2.6, 0], drift: { azimuth: 5 } },
          ]);
          // The tally climbs with the wall, then stops dead on "non lo sai".
          const stop = b(4, 3);
          const n = t < stop ? 1 + Math.floor(PF.clamp01((t - b(3, 1)) / (stop - b(3, 1))) * 17) : 18;
          const el = $("#count");
          PF.show(el, true);
          el.textContent = `STESSA RICHIESTA · ${String(n).padStart(2, "0")}`;
          PF.css(el, { opacity: (0.55 + 0.45 * (t < stop ? 1 : 1)).toFixed(2), color: t < stop ? C.ink : C.cream });
        } else PF.show($("#count"), false);

        /* ---------- 03 Il taglio ---------- */
        if (k === 2) {
          st.use(S.s3);
          S.burst.update(t);
          S.three3.forEach((o) => {
            const u = PF.step(t - b(5, 1) - 0.1, { stiffness: 70, damping: 13 });
            o.m.visible = u > 0.002;
            o.m.position.set(o.k * 1.42 * u, 0, -3 + 4.2 * u);
            o.m.rotation.z = (1 - u) * 1.4;
          });
          PF.three.shots(st.camera, t, [
            { at: b(5, 1), azimuth: 0, elevation: 4, radius: 8.4, target: [0, 0, 0], drift: { radius: -2.6 } },
            { at: b(5, 2), azimuth: -8, elevation: -2, radius: 4.6, target: [0, 0, 0.6], drift: { azimuth: 6, radius: -0.8 } },
            { at: TAGLIO, azimuth: 0, elevation: 0, radius: 12, target: [0, 0, 0], drift: {} },
          ]);
          // The dry cut: ink goes black for the half beat of silence, the number alone.
          if (t >= TAGLIO) bg = "#000000";
        }

        /* ---------- 04 La soluzione ---------- */
        if (k === 3) {
          bg = C.coral;
          st.use(S.s4);
          // The signature: the shield turns a sixth on bar 7 beat 1 and locks.
          const turn = AVVITA(PF.progress(t, b(7, 1), 0.48));
          S.shield.rotation.y = turn * (Math.PI / 3);
          S.shield.rotation.x = Math.PI / 2 - 0.34 * AVVITA(PF.progress(t, b(8, 1), 0.5));
          S.tokens.forEach((o) => {
            const u = PF.step(t - o.on, { stiffness: 85, damping: 14 });
            o.m.visible = u > 0.002;
            o.m.position.set((o.i - 1) * 1.25, PF.lerp(-3.0, -1.62, u), 0.9);
            o.m.rotation.y = (1 - u) * 1.1;
            // One glow pass across the row on bar 8 beat 3.
            const g = CLICK(PF.progress(t, b(8, 3) + o.i * 0.07, 0.3)) * (1 - PF.clamp01((t - b(8, 3) - o.i * 0.07 - 0.3) / 0.4));
            o.m.scale.setScalar(1 + 0.1 * g);
          });
          S.dust4.update(t);
          PF.three.shots(st.camera, t, [
            { at: b(6, 1), azimuth: -22, elevation: 16, radius: 8.0, target: [0, 1.5, 0], drift: { azimuth: 8, radius: -0.6 } },
            { at: b(6, 3), azimuth: 12, elevation: 8, radius: 6.8, target: [0, 1.1, 0], drift: { azimuth: -6 } },
            { at: b(7, 1), azimuth: -4, elevation: 18, radius: 7.8, target: [0, 1.6, 0], drift: { elevation: -5 } },
            { at: b(7, 3), azimuth: 18, elevation: 10, radius: 7.2, target: [0, 1.2, 0], drift: { azimuth: -8 } },
            { at: b(8, 1), azimuth: 0, elevation: 5, radius: 7.6, target: [0, 1.4, 0], drift: { radius: -0.5 } },
            { at: b(8, 3), azimuth: -10, elevation: 14, radius: 7.0, target: [0, 1.2, 0], drift: { azimuth: 6 } },
          ]);
        }

        /* ---------- 05 Beneficio ---------- */
        if (k === 4) {
          const second = t >= CREDITI;
          bg = second ? C.ink : C.cream;
          st.use(second ? S.s5b : S.s5a);
          const p = second ? S.prismB : S.prismA;
          const s0 = second ? CREDITI : b(9, 1);
          // A sixth of a turn on beats 1 and 3 of the bar, stopping dead.
          const turns = [0, 2].reduce((a, bt) => a + AVVITA(PF.progress(t, s0 + bt * b.beat, 0.48)), 0);
          p.rotation.set(Math.PI / 2 - 0.35, turns * (Math.PI / 3) + 0.2, 0);
          if (second) S.dust5.update(t);
          PF.three.shots(st.camera, t, [
            { at: b(9, 1), azimuth: -20, elevation: 14, radius: 7.0, target: [0, 2.1, 0], drift: { azimuth: 8 } },
            { at: b(9, 3), azimuth: 14, elevation: 6, radius: 6.2, target: [0, 1.9, 0], drift: { azimuth: -7 } },
            { at: CREDITI, azimuth: -16, elevation: 16, radius: 7.0, target: [0, 2.2, 0], drift: { azimuth: 7, radius: -0.5 } },
            { at: b(10, 3), azimuth: 18, elevation: 8, radius: 6.4, target: [0, 2.0, 0], drift: { azimuth: -8 } },
          ]);
        }

        /* ---------- 06 Manuvo ---------- */
        if (k === 5) {
          bg = C.coral;
          st.use(S.s6);
          const solid = PF.clamp01(PF.progress(t, b(11, 3), 0.42));
          S.swarm.update(t);
          S.swarm.points.material.opacity = 1 - solid;
          S.swarm.points.visible = solid < 1;
          S.logo.visible = solid > 0;
          S.logoFace.opacity = solid;
          S.logoSide.opacity = solid;
          // The lockup drifts up into its final place and holds.
          const settle = AVVITA(PF.clamp01(PF.progress(t, b(11, 3), 0.8)));
          S.logoGroup.position.set(0, PF.lerp(0, 0.5, settle), 0);
          S.logoGroup.rotation.y = (1 - settle) * 0.22;
          S.dust6.update(t);
          PF.three.shots(st.camera, t, [
            { at: b(11, 1), azimuth: -14, elevation: 8, radius: 8.0, target: [0, -0.7, 0], drift: { azimuth: 6, radius: -1.0 } },
            { at: b(11, 3), azimuth: 0, elevation: 2, radius: 6.6, target: [0, -0.45, 0], drift: { radius: -0.3 } },
            { at: b(12, 1), azimuth: 4, elevation: 1, radius: 6.5, target: [0, -0.45, 0], drift: { azimuth: -3 } },
          ]);
          // One shockwave when the logo turns solid.
          const ring = PF.ring(t, b(11, 3), { length: 0.7, from: 90, to: 760 });
          PF.show($("#ring"), ring.opacity > 0.01);
          PF.css($("#ring"), { left: `${540 - ring.r}px`, top: `${720 - ring.r}px`, width: `${ring.r * 2}px`, height: `${ring.r * 2}px`, opacity: ring.opacity.toFixed(3), borderWidth: `${ring.width.toFixed(1)}px` });
        } else PF.show($("#ring"), false);

        st.render();

        /* ---------- words ---------- */
        slam("#w1a", t, b(1, 1), b(2, 1) - 0.14);
        slam("#w1b", t, b(1, 2), b(2, 1) - 0.14, 1.5);
        slam("#w1c", t, b(2, 1), b(3, 1));
        slam("#w1d", t, b(2, 2), b(3, 1));
        slam("#w2a", t, b(3, 1), b(3, 3) - 0.14);
        slam("#w2b", t, b(3, 3), b(4, 1) - 0.14);
        slam("#w2c", t, b(4, 1), b(4, 3) - 0.14);
        slam("#w2d", t, b(4, 3), b(5, 2), 1.18);
        slam("#w3a", t, TAGLIO, b(6, 1), 1.6);
        slam("#w4a", t, b(6, 1), b(7, 1) - 0.14, 1.16);
        slam("#w4b", t, b(6, 1), b(7, 1) - 0.14, 1.5);
        slam("#w4c", t, b(6, 2), b(7, 1) - 0.14);
        slam("#w4d", t, b(7, 1), b(9, 1) - 0.14);
        slam("#w4e", t, b(7, 3), b(9, 1) - 0.14);
        slam("#w4f", t, b(8, 1), b(9, 1) - 0.14);
        slam("#w5a", t, b(9, 1), CREDITI - 0.14);
        slam("#w5b", t, b(9, 2), CREDITI - 0.14);
        slam("#w5c", t, CREDITI, b(10, 4, 0.5), 1.5);
        slam("#w5d", t, b(10, 2), b(10, 4, 0.5));
        rise("#w5e", t, CREDITI + 0.08, b(11, 1));
        slam("#w6a", t, b(11, 3) + 0.1, CUES.duration);
        rise("#w6b", t, b(11, 4), CUES.duration, 20);

        /* ---------- camera shake on the burst, wipes, grade ---------- */
        const shake = PF.shake(t, [b(5, 1), b(5, 2), TAGLIO].map((x) => ({ at: x, amount: 18 })));
        PF.css($("#cam"), { transform: `translate(${shake.x.toFixed(2)}px,${shake.y.toFixed(2)}px)` });

        // Scene changes that need a wipe rather than a hard cut.
        const wipe = $("#wipe");
        const WIPES = [
          { at: b(3, 1), kind: "iris", color: C.coral, y: 620, length: 0.42 },
          { at: b(6, 1), kind: "iris", color: C.coral, y: 1320, length: 0.46 },
          { at: b(8, 4, 0.5), kind: "up", color: C.cream, length: 0.4 },
          { at: b(10, 4, 0.5), kind: "iris", color: C.coral, y: 1420, length: 0.42 },
        ];
        const T0 = WIPES.find((x) => t >= x.at && t < x.at + x.length);
        PF.show(wipe, !!T0);
        if (T0) {
          const p = PF.clamp01((t - T0.at) / T0.length);
          PF.css(wipe, { background: T0.color });
          if (T0.kind === "iris") PF.iris(wipe, p, 540, T0.y, W, H); else PF.flood(wipe, p, T0.kind);
        }

        // The scrim only where the subject is dense under the words.
        const scrimOn = k === 0 || (k === 1 && t < b(5, 1)) || (k === 3 && t < b(9, 1));
        PF.show($("#scrim"), scrimOn);
        if (scrimOn) {
          const rgb = bg === C.coral ? "255,87,88" : "27,30,36";
          PF.css($("#scrim"), { background: `linear-gradient(180deg, rgba(${rgb},.96) 0%, rgba(${rgb},.92) 34%, rgba(${rgb},.55) 46%, rgba(${rgb},0) 56%)` });
        }
        PF.css($("#vignette"), { background: PF.vignette(bg === C.cream ? 0.1 : 0.3, bg === C.coral ? "110,22,24" : "0,0,0") });
        hud.set({ tl: LABEL[k], tr: k < 3 ? "● REC" : "Manuvo", bl: "Rimini · Romagna", br: PF.timecode(t, 30) }, t);
        PF.grain($("#grain"), t, { alpha: 0.07 });
      }

      PF.film({
        duration: CUES.duration,
        setup,
        draw,
        waitFor: [PF.signal("three")],
        // Registered only after setup and the clock are built (fonts first).
        register: (tl) => {
          window.__timelines["main"] = tl;
        },
      });
    </script>
  </body>
</html>
