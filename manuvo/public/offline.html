<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manuvo — offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #faf8f4;
        color: #1b1e24;
        font-family: system-ui, -apple-system, Arial, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #0e5a61;
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 30px;
      }
      h1 { font-size: 20px; margin: 8px 0 0; }
      p { color: #5a5f69; max-width: 30ch; margin: 0; }
      button {
        margin-top: 8px;
        border: none;
        background: #0e5a61;
        color: #fff;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="logo">M</div>
    <h1>Sei offline</h1>
    <p>Manuvo ha bisogno di una connessione. Controlla la rete e riprova.</p>
    <button onclick="location.reload()">Riprova</button>
  </body>
</html>
